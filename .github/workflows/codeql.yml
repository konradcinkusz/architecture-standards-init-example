name: CodeQL

# Static analysis exists only when a human remembers to run it, unless it is a
# job (REPO-BASELINE §1). The schedule matters as much as the PR trigger: a
# vulnerability class published next month applies to code that stopped changing
# last month.
#
# REPO-BASELINE §1 pairs SAST with a dependency audit, and there is deliberately
# no dependency-review job here: it requires the repository's Dependency graph
# feature, which is not enabled, and a job that fails on every pull request for a
# reason no diff can fix trains people to ignore CI. Recorded as a dated row in
# the deviation register (docs/architecture/00-ARCHITECTURE.md §3) rather than
# left as an unexplained absence, and Dependabot still raises update pull
# requests in the meantime.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
