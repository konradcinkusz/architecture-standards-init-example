name: Secret scan

# The CI half of P5's enforcement. The other half is the pre-commit hook that
# scripts/setup.sh installs — both, deliberately: the hook catches the mistake
# before it becomes history, this job catches contributors without hooks.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, not just the tip: a credential added and then
          # removed in a later commit is still a credential that was pushed.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
